org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.configuration-cache=true
kotlin.code.style=official
android.useAndroidX=true

# The app's version, read by app/build.gradle.kts and checked by
# scripts/check_version.py. versionName is the PRODUCT version, the same
# x.y.z as iOS's MARKETING_VERSION (owner decision, 11.10.2026): one release,
# one number in both stores, one CHANGELOG. versionCode is Google Play's own
# counter, unrelated to the iOS build number: +1 for every bundle uploaded to
# Play, whatever the track — Play refuses a code it has seen, and a lower one
# never updates a phone.
dredfit.versionName=2.5.0
dredfit.versionCode=1
