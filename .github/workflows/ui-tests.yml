name: UI Tests

# UI tests only — the unit suites already run on every push in ci.yml.
#
# These are slow (~75-100 min) and occasionally flaky on shared runners, so
# they deliberately do NOT gate anything: no PR checks, no release branches.
# A red run here is a signal to investigate before the next release, not a
# reason to hold one back. Release branches are gated by ci.yml (unit tests)
# plus a local UI run — see .github/WORKFLOWS.md, "Release procedure".
#
# Triggers:
#   - nightly on the default branch (develop) — but the suite runs only when
#     something it builds or drives changed since the last commit a run
#     tested: the app, the engine it links, the widget and shared code
#     embedded in it, the UI tests, the project and test plan, or this
#     workflow. Unit tests, docs, store material and scripts do not count.
#   - manually via "Run workflow" (any branch) — always runs the suite.
#
# Until 30.09.2026 every night ran the suite, and most nights re-tested a
# commit already tested — 11–30.09: 20 nights, 8 commits, d27a561 five
# times, fc9faa5 four, 47e6d19 three, going red and green on the same code.
# A night with nothing new now skips it. That includes the night after a red
# run: a flake stays the latest result until the next change or a manual
# rerun, and a runner image that changes under unchanged code goes unseen.

on:
  schedule:
    - cron: "30 2 * * *"
  workflow_dispatch:

concurrency:
  group: ui-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Anything new for the UI suite?
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read    # the previous runs of this workflow
      contents: read
    outputs:
      run: ${{ steps.diff.outputs.run }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Any doubt resolves to running the suite: a skipped night that should
      # have run is the one outcome nobody would notice.
      - name: Compare with the last tested commit
        id: diff
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" != "schedule" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # A completed run that succeeded or failed tested its head commit,
          # or skipped it for having nothing new — the same thing here.
          # Cancelled and timed-out runs tested nothing and do not count.
          if ! last=$(gh run list --workflow ui-tests.yml --branch develop \
                        --status completed --limit 30 --json headSha,conclusion \
                        --jq '[.[] | select(.conclusion == "success" or .conclusion == "failure")][0].headSha // ""'); then
            echo "::warning::Could not read the previous runs; running the suite."
            last=""
          fi
          if [ -z "$last" ] || ! git cat-file -e "$last^{commit}" 2>/dev/null; then
            echo "No tested commit to compare with; running the suite."
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed=$(git diff --name-only "$last" HEAD -- \
            ios ':(exclude)ios/DredfitTests' ':(exclude)ios/DredfitCore/Tests' \
            .github/workflows/ui-tests.yml .github/actions/setup-xcode)
          if [ -n "$changed" ]; then
            echo "Changed since ${last:0:7}:"
            echo "$changed"
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "Nothing the UI suite builds or drives changed since ${last:0:7}; skipping it." \
              | tee -a "$GITHUB_STEP_SUMMARY"
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

  ui-suite:
    needs: changes
    if: needs.changes.outputs.run == 'true'
    name: DredfitUITests (iOS Simulator)
    runs-on: macos-latest
    # A clean run takes 75-100 min, and with the retries working a genuine
    # regression runs each failing test three times. At 120 the job would be
    # killed before xcodebuild printed which tests failed.
    timeout-minutes: 240
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Select Xcode
        uses: ./.github/actions/setup-xcode

      - name: Select and boot iPhone simulator
        id: sim
        run: |
          line=$(xcrun simctl list devices available | grep -E '^\s+iPhone' | head -1)
          device=$(echo "$line" | sed 's/ (.*//' | xargs)
          udid=$(echo "$line" | grep -oE '[0-9A-F]{8}-[0-9A-F]{4}-[0-9A-F]{4}-[0-9A-F]{4}-[0-9A-F]{12}' | head -1)
          if [ -z "$device" ] || [ -z "$udid" ]; then
            echo "No iPhone simulator found on runner" >&2
            exit 1
          fi
          echo "Using simulator: $device ($udid)"
          echo "device=$device" >> "$GITHUB_OUTPUT"
          # Pre-boot and wait for readiness so the first test isn't racing a
          # cold simulator boot under load (a frequent 'launch timed out').
          xcrun simctl boot "$udid" || true
          xcrun simctl bootstatus "$udid" || true

      - name: Run the UI tests
        run: |
          set -o pipefail
          # Shared macOS runners can't handle parallel UI testing: spawning
          # several simulator clones exhausts the runner, so clones fail to
          # connect ("lockdown timed out") or the host loses connection and
          # the whole run aborts. Disable parallelization so everything runs
          # on one simulator, serially — slower but stable. The same flag is
          # required locally; without it the runner is denied launch with
          # "Application failed preflight checks". (Locally that same error
          # also appears when the simulator already has the app installed by
          # hand: erase the simulator before a local run.)
          #
          # Retry is requested explicitly (xcodebuild ignores the test plan's
          # own repetition settings): a genuinely flaky test re-runs up to 3
          # attempts.
          #
          # These flags did nothing at all until 2026-08-04. Xcode 26 has a
          # known XCTest defect (Apple issue #108565878): with
          # `continueAfterFailure = false` in a Swift class whose test method
          # or setUp/tearDown is async, a failed assertion tears down the
          # whole runner process instead of the test method. xcodebuild then
          # relaunches and resumes at the NEXT test, so the failed one is
          # never re-run — 43 executions for 43 tests, no iteration ever
          # reached 2. The suite's setUp is synchronous, which is Apple's
          # own workaround and restores the retries without giving up
          # fail-fast. It regressed once: #212 made setUp async again, and
          # from 27.08 to 30.09.2026 not one failed assertion was retried —
          # each cost a runner restart and a red run. SwiftLint's
          # `ui_tests_stay_synchronous` now refuses the async form. Two
          # symptoms to recognise if it ever regresses anyway: a root
          # suite named "Selected tests", and a closing "Executed N tests,
          # with 0 failures" that omits the failure the job went red for —
          # that tally belongs to the resumed session alone. The authoritative
          # verdict is "** TEST FAILED **" and the "Failing tests:" list.
          xcodebuild test \
            -project ios/Dredfit.xcodeproj \
            -scheme Dredfit \
            -testPlan Dredfit \
            -only-testing:DredfitUITests \
            -destination "platform=iOS Simulator,name=${{ steps.sim.outputs.device }}" \
            -parallel-testing-enabled NO \
            -retry-tests-on-failure \
            -test-iterations 3 \
            CODE_SIGNING_ALLOWED=NO \
            | xcbeautify --renderer github-actions

      - name: Upload test results on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: xcresult-ui
          path: ~/Library/Developer/Xcode/DerivedData/**/Logs/Test/*.xcresult
          if-no-files-found: ignore
