name: Lint

on:
  push:
    branches: [main, develop, "release/**", "hotfix/**"]
  pull_request:
    branches: [main, develop]

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  swiftlint:
    name: SwiftLint
    runs-on: ubuntu-latest
    # Pinned so a SwiftLint release cannot turn main red on its own. Dependabot
    # does not bump container images: move this by hand, alongside the local
    # swiftlint, after running the new version over the tree.
    container: ghcr.io/realm/swiftlint:0.65.1
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Run SwiftLint
        run: swiftlint lint --reporter github-actions-logging

      # Comments say why for the code as it is now. A spec section (§41.7), an
      # invariant id (И3), a dated review or owner note, or a regulation id
      # (R32) points at a document that is not in the repo, or at a moment
      # that has passed: say the rule it stood for instead. Runs after a red SwiftLint too, so one push reports both.
      # grep exits 1 on no match; anything above that is a guard that checked
      # nothing, and fails rather than passing in silence.
      - name: No spec sections, review dates or R-ids in Swift
        if: ${{ !cancelled() }}
        run: |
          set +e
          grep -rnE '(review|owner|audit|decision),? [0-9]{2}\.[0-9]{2}\.20[0-9]{2}|§ ?[0-9]|И[0-9]|(^|[^[:alnum:]_])R[0-9]{1,2}([^[:alnum:]_]|$)' \
            ios/ --include='*.swift' --exclude-dir=.build
          rc=$?
          case $rc in
            0) echo "::error::The lines above cite a spec section, a review date or an R-id. Write the rule each stood for, in the present tense."
               exit 1 ;;
            1) echo "No spec sections, review dates or R-ids in ios/**/*.swift." ;;
            *) echo "::error::grep exited $rc, so nothing was checked."
               exit 1 ;;
          esac
