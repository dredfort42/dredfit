name: Lint

on:
  push:
    branches: [main, develop, "release/**", "hotfix/**"]
  pull_request:
    branches: [main, develop]

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  swiftlint:
    name: SwiftLint
    runs-on: ubuntu-latest
    # Pinned so a SwiftLint release cannot turn main red on its own. Dependabot
    # does not bump container images: move this by hand, alongside the local
    # swiftlint, after running the new version over the tree.
    container: ghcr.io/realm/swiftlint:0.65.1
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Run SwiftLint
        run: swiftlint lint --reporter github-actions-logging
