name: CI

# Unit tests only (~5-15 min) — core package plus app units, no UI — and an
# unsigned Release build beside them.
#
# This is the gate: green CI is what a merge and a release branch require.
# The two advisory jobs (app-tests-timezone, release-build) are
# continue-on-error, so a failure there shows on the job but leaves the run,
# and the README badge, green.
# UI tests are deliberately not here. They are slow and occasionally flaky on
# shared runners, so they run nightly in ui-tests.yml when the app has
# changed, and gate nothing; before cutting a release branch you run them
# locally instead (.github/WORKFLOWS.md).

on:
  push:
    branches: [main, develop, "release/**", "hotfix/**"]
  pull_request:
    branches: [main, develop]
  # Manual runs, any branch — mostly for app-tests-timezone (below), which
  # does not run on pull requests.
  workflow_dispatch:

concurrency:
  # Manual runs get their own group, so starting one does not cancel the push
  # run already going on the same branch.
  group: ci-${{ github.ref }}-${{ github.event_name == 'workflow_dispatch' && 'manual' || 'auto' }}
  cancel-in-progress: true

jobs:
  core-tests:
    name: DredfitCore package tests
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Select Xcode
        uses: ./.github/actions/setup-xcode

      - name: Run tests
        working-directory: ios/DredfitCore
        # A compiler warning is an error here and in every xcodebuild step
        # below, so a new Xcode's deprecations turn the build red on purpose
        # (WORKFLOWS.md, "Compiler warnings are errors in CI").
        run: swift test --parallel -Xswiftc -warnings-as-errors

  gate-contract:
    name: Engine gate contract
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # The gates themselves cannot run here: they live in `reference/`, which
      # is gitignored and never checked out on a runner. What this catches is
      # the checklist drifting away from them — a row that names no command, or
      # names no line that means clean, is how a gate goes quiet. Running them
      # is a local gate, part of the release procedure in WORKFLOWS.md.
      - name: Check the gate table still parses
        run: python3 scripts/check_engine_gates.py --contract

  app-tests:
    name: Dredfit app unit tests (iOS Simulator, no UI)
    runs-on: macos-latest
    # Serial execution costs wall-clock; the cap is a backstop, not a target.
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Select Xcode
        uses: ./.github/actions/setup-xcode

      - name: Select and boot iPhone simulator
        id: sim
        run: |
          line=$(xcrun simctl list devices available | grep -E '^\s+iPhone' | head -1)
          device=$(echo "$line" | sed 's/ (.*//' | xargs)
          udid=$(echo "$line" | grep -oE '[0-9A-F]{8}-[0-9A-F]{4}-[0-9A-F]{4}-[0-9A-F]{4}-[0-9A-F]{12}' | head -1)
          if [ -z "$device" ] || [ -z "$udid" ]; then
            echo "No iPhone simulator found on runner" >&2
            exit 1
          fi
          echo "Using simulator: $device ($udid)"
          echo "device=$device" >> "$GITHUB_OUTPUT"
          # Pre-boot and wait for readiness, as ui-tests.yml does: the first
          # test should not race a cold simulator boot under load.
          xcrun simctl boot "$udid" || true
          xcrun simctl bootstatus "$udid" || true

      - name: Build and test (UI tests excluded)
        # A wall on the step, not just on the job: a step that runs out fails
        # the run outright, where the job's own cap cancels it — and a
        # cancelled run reads as "someone stopped this", not "CI is broken".
        timeout-minutes: 35
        run: |
          set -o pipefail
          # Serial, deliberately — the same conclusion ui-tests.yml reached for
          # the UI suite, applied here at last (#164). The test plan marks its
          # targets parallelizable, which is right on a developer's machine and
          # wrong on a shared runner: every clone is another simulator's worth
          # of memory beside an Xcode build. As the suite grew, the second
          # clone stopped being able to launch the app at all — "RequestDenied
          # ... denied by service delegate (SBMainWorkspace)" — and from
          # 2026-08-17 no CI run finished on any branch.
          #
          # The timeouts are the safety net. Without them that denied launch
          # left xcodebuild waiting with nothing to say for 17 minutes, until
          # the job hit its own cap: every run since read as "cancelled", with
          # no failing test named anywhere. A per-test allowance turns the same
          # event into a red, named test in minutes.
          #
          # 300 s is a wall, not a target: with the suite healthy the slowest
          # test in it runs in 0.1 s and the whole thing takes under half a
          # minute. The first serial run with these flags spent five minutes in
          # a single test and was killed by them — which is how the stall in
          # JournalSanitizationTests was found at all, after three days of runs
          # that reported nothing.
          xcodebuild test \
            -project ios/Dredfit.xcodeproj \
            -scheme Dredfit \
            -destination "platform=iOS Simulator,name=${{ steps.sim.outputs.device }}" \
            -skip-testing:DredfitUITests \
            -parallel-testing-enabled NO \
            -test-timeouts-enabled YES \
            -default-test-execution-time-allowance 300 \
            -maximum-test-execution-time-allowance 600 \
            -enableCodeCoverage YES \
            CODE_SIGNING_ALLOWED=NO \
            SWIFT_TREAT_WARNINGS_AS_ERRORS=YES GCC_TREAT_WARNINGS_AS_ERRORS=YES \
            | xcbeautify --renderer github-actions

      - name: Coverage summary
        if: always()
        run: |
          # Best-effort per-target coverage into the run summary. Informational
          # only — never fails the job.
          xcresult=$(find ~/Library/Developer/Xcode/DerivedData -type d -name '*.xcresult' -path '*/Logs/Test/*' 2>/dev/null | sort | tail -1)
          if [ -z "$xcresult" ]; then
            echo "No .xcresult found; skipping coverage." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          {
            echo "### Code coverage (per target)"
            echo '```'
            xcrun xccov view --report --only-targets "$xcresult" 2>/dev/null || echo "coverage unavailable"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Print failures and crashes from the result bundle
        # xcbeautify drops xcodebuild's crash lines ("Restarting after
        # unexpected exit…"), so a test killed by a crash shows only its name.
        # The bundle keeps the message; print it where the log can be read.
        if: failure()
        run: |
          xcresult=$(find ~/Library/Developer/Xcode/DerivedData -type d -name '*.xcresult' -path '*/Logs/Test/*' 2>/dev/null | sort | tail -1)
          [ -n "$xcresult" ] || exit 0
          xcrun xcresulttool get test-results tests --path "$xcresult" 2>/dev/null \
            | python3 -c 'import json,sys
          def walk(n, path=""):
              name = n.get("name", "")
              if n.get("nodeType") in ("Failure Message", "Runtime Warning") or "crash" in name.lower():
                  print(path, "::", name)
              for c in n.get("children", []):
                  walk(c, path + "/" + name if n.get("nodeType") == "Test Case" else path or name)
          d = json.load(sys.stdin)
          for t in d.get("testNodes", []): walk(t)' | head -200 || true

      - name: Upload test results on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: xcresult
          path: ~/Library/Developer/Xcode/DerivedData/**/Logs/Test/*.xcresult
          if-no-files-found: ignore

  # The same unit tests in a zone that is not UTC. The runner's clock is UTC,
  # so a day boundary computed in UTC by mistake passes app-tests unseen.
  # Advisory and kept off pull requests: it is another macOS runner beside
  # app-tests, not a second gate. Runs after a merge, or by hand.
  app-tests-timezone:
    name: Dredfit app unit tests (Europe/Berlin, advisory)
    if: github.event_name != 'pull_request'
    continue-on-error: true
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Select Xcode
        uses: ./.github/actions/setup-xcode

      - name: Select and boot iPhone simulator
        id: sim
        run: |
          line=$(xcrun simctl list devices available | grep -E '^\s+iPhone' | head -1)
          device=$(echo "$line" | sed 's/ (.*//' | xargs)
          udid=$(echo "$line" | grep -oE '[0-9A-F]{8}-[0-9A-F]{4}-[0-9A-F]{4}-[0-9A-F]{4}-[0-9A-F]{12}' | head -1)
          if [ -z "$device" ] || [ -z "$udid" ]; then
            echo "No iPhone simulator found on runner" >&2
            exit 1
          fi
          echo "Using simulator: $device ($udid)"
          echo "device=$device" >> "$GITHUB_OUTPUT"
          xcrun simctl boot "$udid" || true
          xcrun simctl bootstatus "$udid" || true

      - name: Build and test in Europe/Berlin (UI tests excluded)
        timeout-minutes: 35
        env:
          # xcodebuild hands TEST_RUNNER_-prefixed variables to the test
          # process with the prefix stripped, so the tests see TZ — and
          # TimeZone.current follows it. Berlin has DST, which UTC lacks.
          TEST_RUNNER_TZ: Europe/Berlin
        run: |
          set -o pipefail
          # Flags as in app-tests, for the same reasons; no coverage.
          xcodebuild test \
            -project ios/Dredfit.xcodeproj \
            -scheme Dredfit \
            -destination "platform=iOS Simulator,name=${{ steps.sim.outputs.device }}" \
            -skip-testing:DredfitUITests \
            -parallel-testing-enabled NO \
            -test-timeouts-enabled YES \
            -default-test-execution-time-allowance 300 \
            -maximum-test-execution-time-allowance 600 \
            CODE_SIGNING_ALLOWED=NO \
            SWIFT_TREAT_WARNINGS_AS_ERRORS=YES GCC_TREAT_WARNINGS_AS_ERRORS=YES \
            | xcbeautify --renderer github-actions

      - name: Upload test results on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: xcresult-timezone
          path: ~/Library/Developer/Xcode/DerivedData/**/Logs/Test/*.xcresult
          if-no-files-found: ignore

  # The archive configuration, which no test run builds: code behind
  # `#if DEBUG`, or that only compiles without it, breaks here and nowhere
  # else until someone archives in Xcode. Unsigned, so it needs no secrets.
  release-build:
    name: Dredfit Release build (generic iOS, unsigned)
    # Advisory for now, like app-tests-timezone: reported, never reddens CI.
    continue-on-error: true
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Select Xcode
        uses: ./.github/actions/setup-xcode

      - name: Build Release
        timeout-minutes: 25
        run: |
          set -o pipefail
          xcodebuild build \
            -project ios/Dredfit.xcodeproj \
            -scheme Dredfit \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            SWIFT_TREAT_WARNINGS_AS_ERRORS=YES GCC_TREAT_WARNINGS_AS_ERRORS=YES \
            | xcbeautify --renderer github-actions
